[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dedsec"
version = "1.3.1"
description = "Evidence-driven web reconnaissance framework for authorized security testing"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
authors = [
  {name = "Sohaim Muqtada"},
]
keywords = ["security", "reconnaissance", "web-security", "pentesting", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "requests==2.32.3",
  "dnspython==2.6.1",
  "python-whois==0.9.5",
  "rich==13.9.4",
  "click<8.2",
  "typer==0.12.5",
]

[project.urls]
Homepage = "https://github.com/muhammadsohaimmuqtada/dedsec"
Repository = "https://github.com/muhammadsohaimmuqtada/dedsec"
Documentation = "https://github.com/muhammadsohaimmuqtada/dedsec/tree/main/docs"
Issues = "https://github.com/muhammadsohaimmuqtada/dedsec/issues"
Security = "https://github.com/muhammadsohaimmuqtada/dedsec/blob/main/SECURITY.md"
Contributing = "https://github.com/muhammadsohaimmuqtada/dedsec/blob/main/CONTRIBUTING.md"

[project.scripts]
dedsec = "dedsec.cli:main"

[project.optional-dependencies]
dev = [
  "black==26.3.1",
  "pytest==8.3.3",
  "ruff==0.7.2",
]

[tool.black]
line-length = 100
target-version = ["py38"]
